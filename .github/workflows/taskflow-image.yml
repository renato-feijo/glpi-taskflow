# Publica a imagem de produção do GLPI-TaskFlow no GHCR.
#
# O Swarm não constrói imagens, então o deploy via Portainer depende de uma
# imagem já publicada. Este workflow fecha esse ciclo: push na branch -> build
# -> ghcr.io -> Portainer puxa.
#
# Roda em runner arm64 porque a VPS de destino é Ampere (aarch64); construir em
# amd64 geraria uma imagem que não executa lá.
name: Build TaskFlow image

on:
  push:
    branches:
      - 11.0/bugfixes
    # Sem paths filter: a imagem empacota a aplicacao inteira (src/, templates/,
    # public/, locales/...), entao qualquer commit de codigo muda o que roda em
    # producao. O filtro anterior so cobria Dockerfile e dependencias e teria
    # deixado passar mudancas de tema, marca e templates sem rebuild.
    paths-ignore:
      - '**.md'
      - 'compose.swarm.yml'
  workflow_dispatch:

concurrency:
  group: taskflow-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # O Portainer CE nao tem o "Re-pull image" (Business), entao um redeploy
      # com a mesma tag "latest" seria no-op no Swarm. Em vez de pedir o pull,
      # tiramos a ambiguidade: o compose passa a apontar para a tag imutavel
      # deste commit, que o no ainda nao tem e portanto precisa buscar.
      #
      # O commit so toca compose.swarm.yml, coberto pelo paths-ignore acima --
      # nao dispara outro build.
      - name: Fixar a tag da imagem no compose
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail

          sed -i -E "s|(image: ghcr\.io/renato-feijo/glpi-taskflow):[^[:space:]]+|\1:${IMAGE_TAG}|g" compose.swarm.yml
          grep -c "glpi-taskflow:${IMAGE_TAG}" compose.swarm.yml

          if git diff --quiet -- compose.swarm.yml; then
            echo "compose ja aponta para ${IMAGE_TAG}; nada a commitar."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compose.swarm.yml
          git commit -m "Deploy ${IMAGE_TAG} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Fecha o ciclo ate producao. O webhook do GitOps faz o Portainer reler a
      # branch -- agora com a tag deste build no compose -- e redeployar.
      #
      # A URL e um segredo porque quem a tiver redeploya a stack. Se ela nao
      # estiver configurada, o build ainda vale (a imagem esta no GHCR) e o
      # passo so avisa, em vez de marcar a execucao como falha.
      - name: Redeploy no Portainer
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${PORTAINER_WEBHOOK_URL}" ]; then
            echo "::warning title=Redeploy nao disparado::Configure o segredo PORTAINER_WEBHOOK_URL; redeploy manual pelo Portainer."
            exit 0
          fi

          # O Portainer responde so depois de recriar os servicos, dai o
          # --max-time generoso. --retry cobre indisponibilidade momentanea.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 300 \
            "${PORTAINER_WEBHOOK_URL}")

          if [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ]; then
            echo "Redeploy disparado (HTTP ${status})."
          else
            echo "::error title=Redeploy falhou::Portainer respondeu HTTP ${status}."
            exit 1
          fi
