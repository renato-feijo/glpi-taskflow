# Publica a imagem de produção do GLPI-TaskFlow no GHCR.
#
# O Swarm não constrói imagens, então o deploy via Portainer depende de uma
# imagem já publicada. Este workflow fecha esse ciclo: push na branch -> build
# -> ghcr.io -> Portainer puxa.
#
# Roda em runner arm64 porque a VPS de destino é Ampere (aarch64); construir em
# amd64 geraria uma imagem que não executa lá.
name: Build TaskFlow image

on:
  push:
    branches:
      - 11.0/bugfixes
    # Sem paths filter: a imagem empacota a aplicacao inteira (src/, templates/,
    # public/, locales/...), entao qualquer commit de codigo muda o que roda em
    # producao. O filtro anterior so cobria Dockerfile e dependencias e teria
    # deixado passar mudancas de tema, marca e templates sem rebuild.
    paths-ignore:
      - '**.md'
      - 'compose.swarm.yml'
  workflow_dispatch:

concurrency:
  group: taskflow-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fecha o ciclo ate producao. O webhook do Portainer refaz o deploy da
      # stack a partir do Git e repuxa a imagem -- sem ele, o Swarm trata a
      # mesma tag "latest" como no-op e nada e recriado.
      #
      # A URL e um segredo porque quem a tiver redeploya a stack. Se ela nao
      # estiver configurada, o build ainda vale (a imagem esta no GHCR) e o
      # passo so avisa, em vez de marcar a execucao como falha.
      - name: Redeploy no Portainer
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${PORTAINER_WEBHOOK_URL}" ]; then
            echo "::warning title=Redeploy nao disparado::Configure o segredo PORTAINER_WEBHOOK_URL; redeploy manual pelo Portainer."
            exit 0
          fi

          # O Portainer responde so depois de recriar os servicos, dai o
          # --max-time generoso. --retry cobre indisponibilidade momentanea.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 300 \
            "${PORTAINER_WEBHOOK_URL}")

          if [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ]; then
            echo "Redeploy disparado (HTTP ${status})."
          else
            echo "::error title=Redeploy falhou::Portainer respondeu HTTP ${status}."
            exit 1
          fi
