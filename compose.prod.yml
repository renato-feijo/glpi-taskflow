# Stack Portainer: GLPI-TaskFlow + Traefik
# Pré-requisitos na VPS:
#   - Traefik já rodando na rede externa "traefik-net" com o certresolver "letsencrypt"
#   - DNS do domínio (${GLPI_DOMAIN}) apontando para a VPS
#
# Configure as variáveis abaixo em Portainer > Stacks > (esta stack) > Environment variables,
# ou use um arquivo .env na mesma pasta do stack.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: glpi-taskflow:latest
    container_name: glpi-taskflow-app
    restart: unless-stopped
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_PORT: "3306"
      GLPI_DB_NAME: ${GLPI_DB_NAME:-glpi}
      GLPI_DB_USER: ${GLPI_DB_USER:-glpi}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?defina GLPI_DB_PASSWORD}
      GLPI_DEFAULT_LANGUAGE: ${GLPI_DEFAULT_LANGUAGE:-pt_BR}
    volumes:
      - glpi_files:/var/www/glpi/files
      - glpi_config:/var/www/glpi/config
      - glpi_marketplace:/var/www/glpi/marketplace
    depends_on:
      - db
    networks:
      - traefik
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"

      - "traefik.http.routers.glpi-taskflow.rule=Host(`${GLPI_DOMAIN}`)"
      - "traefik.http.routers.glpi-taskflow.entrypoints=websecure"
      - "traefik.http.routers.glpi-taskflow.tls=true"
      - "traefik.http.routers.glpi-taskflow.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.glpi-taskflow.loadbalancer.server.port=80"

      # Redireciona HTTP -> HTTPS (ajuste o nome do router se seu Traefik já fizer isso globalmente)
      - "traefik.http.routers.glpi-taskflow-insecure.rule=Host(`${GLPI_DOMAIN}`)"
      - "traefik.http.routers.glpi-taskflow-insecure.entrypoints=web"
      - "traefik.http.routers.glpi-taskflow-insecure.middlewares=glpi-taskflow-https-redirect"
      - "traefik.http.middlewares.glpi-taskflow-https-redirect.redirectscheme.scheme=https"

  db:
    image: mariadb:11.8
    container_name: glpi-taskflow-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${GLPI_DB_ROOT_PASSWORD:?defina GLPI_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${GLPI_DB_NAME:-glpi}
      MARIADB_USER: ${GLPI_DB_USER:-glpi}
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:?defina GLPI_DB_PASSWORD}
    volumes:
      - glpi_db_data:/var/lib/mysql
    networks:
      - internal
    # GLPI exige ONLY_FULL_GROUP_BY desabilitado e innodb_file_per_table habilitado
    command: >
      --sql-mode="NO_ENGINE_SUBSTITUTION"
      --innodb-file-per-table=1

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    image: glpi-taskflow:latest
    container_name: glpi-taskflow-cron
    restart: unless-stopped
    depends_on:
      - db
      - app
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_PORT: "3306"
      GLPI_DB_NAME: ${GLPI_DB_NAME:-glpi}
      GLPI_DB_USER: ${GLPI_DB_USER:-glpi}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?defina GLPI_DB_PASSWORD}
    volumes:
      - glpi_files:/var/www/glpi/files
      - glpi_config:/var/www/glpi/config
      - glpi_marketplace:/var/www/glpi/marketplace
    networks:
      - internal
    entrypoint: ["docker-entrypoint.sh"]
    # Roda as tasks agendadas do GLPI (SLA, notificações, etc.) a cada minuto
    command: >
      bash -c "while true; do php bin/console glpi:cron --no-interaction || true; sleep 60; done"

networks:
  traefik:
    external: true
    name: traefik-net
  internal:
    driver: bridge

volumes:
  glpi_db_data:
  glpi_files:
  glpi_config:
  glpi_marketplace:
